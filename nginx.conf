worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        ssi on;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        # mon stats
        location ~ "^/mons/[a-z0-9-]+$" {
            rewrite "^/mons/[a-z0-9-]+$" /index.html last;
        }

        # individual mon page
        location ~ "^/mon/[a-z0-9-]+$" {
            rewrite "^/mon/([a-z0-9-]+)$" /index.html last;
        }

        # big players list
        location ~ "^/players(/search)?$" {
            rewrite "^/players(/search)?$" /index.html last;
        }

        # individual player page
        location ~ "^/player/[a-z0-9-]+$" {
            rewrite "^/player/([a-z0-9-]+)$" /index.html last;
        }

        # events page
        location ~ "^/events$" {
            rewrite "^/events$" /index.html last;
        }

        # the "api"

        location ~ "^/api/v1/mons/all$" {
            rewrite "^/api/v1/mons/all$" /data/mon/all.json last;
        }

        location ~ "^/api/v1/mons/[0-9]{4}$" {
            rewrite "^/api/v1/mons/([0-9]{4})$" /data/mon/$1.json last;
        }

        location ~ "^/api/v1/mons/reg-[a-z]-[a-z]$" {
            rewrite "^/api/v1/mons/(reg-[a-z]-[a-z])$" /data/mon/$1.json last;
        }

        location ~ "^/api/v1/mon/[a-z][a-z-]+$" {
            rewrite "^/api/v1/mon/([a-z])([a-z-]+)$" /data/mon/$1/$1$2/all.json last;
        }

        location ~ "^/api/v1/players/all$" {
            rewrite "^/api/v1/players/all$" /data/player/all.json last;
        }

        location ~ "^/api/v1/players/search$" {
            rewrite "^/api/v1/players/search$" /data/player/search.json last;
        }

        location ~ "^/api/v1/player/[a-z0-9-]+$" {
            rewrite "^/api/v1/player/(([a-z0-9-])([a-z0-9-])[a-z0-9-])([a-z0-9-]*)" /data/player/$2/$2$3/$1/$1$4/all.json last;
        }

        # more to come!
    }
}
